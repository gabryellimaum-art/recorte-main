<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE.CORTE</title>

<script>
  /* ao abrir ou recarregar o site, o jogo e os cards recomeçam */
  try {
    localStorage.removeItem("recorte-jogo");
    sessionStorage.removeItem("recorte-cards");
  } catch (e) {}
</script>

    <link rel="preload" as="image" href="img/garimpar/nav/4x/botao-moldura-normal@4x.png">

     <!-- pré-carrega o GIF da tesoura (usado no clique) -->
    <link rel="preload" as="image" href="img/1x/tesoura-gif.gif">
    
    <script src="legendas.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        .metade {
            position: fixed;
            left: 0;
            width: 100%;
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1s ease-in;
        }

        .cima {
    top: 0;
    height: calc(50% + 1px);
    align-items: flex-end;
    padding-bottom: 20px;
    background: url("img/1x/fundo-capa.jpg") center top / 100% 200% no-repeat;
        }

        .baixo {
            bottom: 0;
            align-items: flex-start;
            padding-top: 150px;
            background: url("img/1x/fundo-capa.jpg") center bottom / 100% 200% no-repeat;
        }

        .titulo {
            color: #fff;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
        }

        #garimpar {
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  transition: transform 0.18s steps(4);
}

#garimpar {
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  transition: transform 0.08s steps(2);
}

#garimpar img {
  display: block;
  width: 120px;
  image-rendering: pixelated;
}

/* por padrão: versão com sombra */
#garimpar .garimpar__pressionado { display: none; }

/* hover e foco: troca a moldura e desloca para onde estava a sombra */
#garimpar:hover .garimpar__normal,
#garimpar:focus-visible .garimpar__normal { display: none; }

#garimpar:hover .garimpar__pressionado,
#garimpar:focus-visible .garimpar__pressionado { display: block; }

#garimpar:hover,
#garimpar:focus-visible,
#garimpar:active {
  transform: translate(-4px, 4px);
}

@media (prefers-reduced-motion: reduce) {
  #garimpar { transition: none; }
}

        .linha {
            position: fixed;
            top: calc(50% + 2px);
            left: 0;
            width: 100%;
            height: 6px;
             background: repeating-linear-gradient(
        to right,
        #fff 0 20px,            /* tamanho do traço */
        transparent 20px 34px   /* traço + respiro: 44 - 20 = 24px de espaço */
    );
            z-index: 3;
        }

        .tesoura {
            position: fixed;
            top: 50%;
            left: 70px;
            transform: translate(-50%, -50%);
            font-size: 36px;
            z-index: 6;
            transition: left 1.1s linear;
        }

        .aberto .cima {
            transform: translateY(-100%);
        }

        .aberto .baixo {
            transform: translateY(100%);
        }

        .aberto .tesoura {
            left: 100%;
        }
.logo {
    position: fixed;
    left: 50%;
    top: 24%;                       /* posição final */
    transform: translate(-50%, -50%);
    z-index: 7;
    transition: opacity 0.4s;
    /* começa no centro (26vh abaixo) e sobe usando só transform */
    animation: sobe 1s cubic-bezier(0.65, 0, 0.35, 1) 2.2s backwards;
}

.logo img {
    display: block;
    width: 30vw;
    will-change: transform;
    animation:
        zoom 2s cubic-bezier(0.3, 0.1, 0.2, 1) both,
        fade 0.5s ease-out both;
}

/* linha: fade in */
.linha {
    opacity: 0;
    animation: fade 0.8s ease 2.6s forwards;
}

/* botão: mantido como estava */
#garimpar {
    opacity: 0;
    animation: aparece 0.6s ease 3s forwards;
}

/* tesoura: desliza da esquerda, de fora da tela */
.tesoura img {
    animation: tesoura-entra 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 2.8s backwards;
}

.aberto .logo {
    opacity: 0;
}

@keyframes zoom {
    from { transform: scale(0.1); }
    to   { transform: scale(1); }
}

@keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@keyframes sobe {
    from { transform: translate(-50%, calc(-50% + 26vh)); }
    to   { transform: translate(-50%, -50%); }
}

@keyframes tesoura-entra {
    from { translate: -200px 0; }
    to   { translate: 0 0; }
}

@keyframes aparece {
    to { opacity: 1; }
}

/* mantém tudo pausado até o JS liberar */
body:not(.pronto) .logo,
body:not(.pronto) .logo img,
body:not(.pronto) .linha,
body:not(.pronto) #garimpar,
body:not(.pronto) .tesoura img {
    animation-play-state: paused;
}

.tesoura img {
    display: block;
    width: 70px;          /* tamanho da tesoura estática (PNG) */
    animation: tesoura-entra 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 2.8s backwards;
}

.tesoura img.animada {
    width: 100px;          /* tamanho do GIF: ajuste até igualar */
}
.destino {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 0;
}

.metade,
.tesoura {
    transition: none;
}

.aberto .cima,
.aberto .baixo {
    transform: none;
}
    </style>
</head>
<body>
    <iframe class="destino" src="garimpar.html"></iframe>

    <div class="logo"><img src="img/1x/logocapa.png" alt="Recorte"></div>

    <div class="metade cima"></div>

    <div class="linha"></div>
    <div class="tesoura" id="tesoura"><img src="img/1x/tesoura.png" alt="Tesoura"></div>

    <div class="metade baixo">
        <button id="garimpar">
    <img class="garimpar__normal" src="img/1x/botao-seguir-sombra.png" alt="Garimpar">
    <img class="garimpar__pressionado" src="img/1x/botao-seguir.png" alt="" aria-hidden="true">
        </button>
    </div>

    <script>
        // só inicia as animações da capa quando a logo já estiver pronta
const logoImg = document.querySelector(".logo img");
function iniciar() { document.body.classList.add("pronto"); }

(logoImg.decode ? logoImg.decode() : Promise.resolve())
    .then(function () { requestAnimationFrame(iniciar); })
    .catch(iniciar);

setTimeout(iniciar, 1500); // segurança, caso a imagem demore demais
        const DURACAO = 3500;
        const ABERTURA = 0.5;

        const botao = document.getElementById("garimpar");
        const tesoura = document.getElementById("tesoura");
        const linha = document.querySelector(".linha");
        const cima = document.querySelector(".cima");
        const baixo = document.querySelector(".baixo");
        let cortando = false;

        botao.addEventListener("click", function () {
    if (cortando) return;
    cortando = true;

    const inicio = parseFloat(getComputedStyle(tesoura).left);
    tesoura.style.left = inicio + "px";
    document.body.classList.add("aberto");

    // troca o PNG estático pelo GIF (não trava o corte se falhar)
    const tesouraImg = tesoura.querySelector("img");
    if (tesouraImg) {
        tesouraImg.src = "img/1x/tesoura-gif.gif";
        tesouraImg.classList.add("animada");
    }

            const largura = window.innerWidth;
            const k = largura * ABERTURA;
            const total = largura + k;
            const t0 = performance.now();

            function passo(agora) {
                const p = Math.min((agora - t0) / DURACAO, 1);
                const x = p * total;

                tesoura.style.left = (inicio + x) + "px";
                linha.style.clipPath = "inset(0 0 0 " + x + "px)";
                cima.style.clipPath = "polygon(" + (x - k) + "px 0, 100% 0, 100% 100%, " + x + "px 100%)";
                baixo.style.clipPath = "polygon(" + x + "px 0, 100% 0, 100% 100%, " + (x - k) + "px 100%)";

                if (p < 1) {
                    requestAnimationFrame(passo);
                } else {
                    setTimeout(function () {
                        // Em vez de trocar de página, esconde a capa e libera a página de trás
document.querySelectorAll("body > *:not(.destino):not(script):not(style)").forEach(function (el) {
  el.style.display = "none";
});
const destino = document.querySelector(".destino");
destino.style.pointerEvents = "auto";
destino.style.zIndex = "9999";
                    }, 150);
                }
            }

            requestAnimationFrame(passo);
        });
    </script>
</body>
</html>
